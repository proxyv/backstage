app:
  # This MUST match your Cloud Run URL
  baseUrl: https://backstage-demo-878837935390.us-central1.run.app

backend:
  baseUrl: https://backstage-demo-878837935390.us-central1.run.app
  listen:
    host: 0.0.0.0
    port: 7007
  
  database:
    client: better-sqlite3
    connection:
      directory: ./data
    # ADDED: Essential for SQLite stability in the new backend system
    knexConfig:
      pool:
        min: 1
        max: 1

  cors:
    origin: https://backstage-demo-878837935390.us-central1.run.app
    methods: [GET, POST, PUT, DELETE]
    credentials: true

  auth:
    keys:
      - secret: ${BACKEND_SECRET}
    # ADDED: Enables the Guest login button in the UI
    providers:
      guest: {}

catalog:
  import:
    entityFilename: catalog-info.yaml
    recursive: true
  locations:
    - type: url
      target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all-entities.yaml
      rules:
        - allow: [Component, System, API, Group, User, Resource, Location]
