name: Backstage Demo Deployment
on:
  push:
    branches: [ Feature01 ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- STEP 1: COMPLIE THE APP (Mandatory for Backstage) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install and Build Backend
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:backend
      # -------------------------------------------------------

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # --- STEP 2: BUILD DOCKER WITH THE CORRECT PATH ---
      - name: Build and Push Image
        run: |
          # We use -f to point to the nested Dockerfile, but . to keep the root context
          docker build -f packages/backend/Dockerfile -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage-repo/backstage:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage-repo/backstage:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backstage-demo \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage-repo/backstage:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --set-env-vars="BACKEND_SECRET=${{ secrets.BACKEND_SECRET }}"
