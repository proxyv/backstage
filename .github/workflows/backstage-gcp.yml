name: Backstage Demo Deployment
on:
  push:
    branches: [ Feature01 ] # Or whichever branch you are using

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to GCP using WIF
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 2. Setup Google Cloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Build the Docker Image (Using Google's Cloud Build is often faster, but we'll use Docker for simplicity)
      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage-repo/backstage:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage-repo/backstage:latest

      # 4. Deploy to Cloud Run (Stateless / No Bucket)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backstage-demo \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage-repo/backstage:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --set-env-vars="BACKEND_SECRET=${{ secrets.BACKEND_SECRET }}"
